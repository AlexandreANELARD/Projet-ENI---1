<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromoENI - Accueil</title>
    <!--Import de la police Roboto de Google-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <img src="assets/images/logo.png" alt="logo de l'école ENI">
        <h1 id="title"></h1>
        <nav>
            <a href="index.html" class="header-button" id="accueil-button">Accueil</a>
            <a href="preferences.html" class="header-button" id="preferences-button">Préférences</a>
            <a href="carte.html" class="header-button" id="carte-button">Carte</a>
            <a href="informations.html" class="header-button" id="infos-button">Informations</a>
        </nav>
    </header>

    <main id="page-accueil">

        <fieldset id="fieldset-accueil">
            <legend>Type d'affichage : </legend>
            <input type="radio" name="affichage" id="list" value="list" checked>
            <label for="list">Liste</label>
            <input type="radio" name="affichage" id="cards" value="cards">
            <label for="cards">Cartes</label>
        </fieldset>

        <h2 id="title-list">Liste des apprenants</h2>

        <div id="conteneur-tableau">
            <table id="tableau-apprenants">
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Ville</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="liste-apprenants">
                </tbody>
            </table>
        </div>

        <div id="conteneur-cards"></div>
    </main>

</body>

</html>
